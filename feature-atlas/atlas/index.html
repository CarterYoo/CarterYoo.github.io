<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feature Map · Dream and LLaDA</title><meta name="description" content="Choose Dream or LLaDA and move through 16 measured time bins.">
<style>
:root{color-scheme:light;--ink:#233c42;--muted:#7a868b;--line:#e9edef;--accent:#294f58}*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}body{height:100dvh;display:grid;grid-template-rows:70px minmax(0,1fr) 108px;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.models{display:flex;align-items:end;justify-content:center;gap:12px;padding-top:env(safe-area-inset-top)}button{font:inherit;cursor:pointer}.model{width:112px;min-height:45px;padding:9px 12px 12px;border:0;border-bottom:2px solid transparent;background:#fff;color:#65757c;font-size:17px;font-weight:500;letter-spacing:-.02em}.model[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}.model:disabled{cursor:wait}.model:focus-visible,input:focus-visible,.close:focus-visible{outline:2px solid #6399a5;outline-offset:5px}
.map{position:relative;width:100%;min-height:0;overflow:hidden;background:#fff;touch-action:manipulation}.map canvas{display:block;position:absolute;inset:0;width:100%;height:100%}#boundaries{pointer-events:none}.loading{position:absolute;inset:0;display:grid;place-content:center;background:#fffc;color:var(--muted);font-size:14px;z-index:3}
.time{width:min(760px,calc(100% - 64px));margin:0 auto;padding:8px 0 calc(20px + env(safe-area-inset-bottom));display:grid;align-content:start;gap:6px}.current{text-align:center;font-variant-numeric:tabular-nums;font-size:15px;letter-spacing:.02em;color:var(--ink)}input[type="range"]{margin:0;width:100%;height:30px;accent-color:var(--accent);cursor:ew-resize;touch-action:pan-y}input:disabled{cursor:wait}.ends{display:flex;justify-content:space-between;font-size:11px;line-height:1;color:#65757c;font-variant-numeric:tabular-nums}
.tooltip{position:absolute;z-index:2;width:270px;max-width:calc(100% - 24px);padding:16px 38px 16px 16px;background:#fffffff2;border:1px solid #e1e7e9;box-shadow:0 3px 15px #19323b0c;color:#30444b;pointer-events:auto}.tooltip p{font-size:14px;line-height:1.5;margin:0;overflow-wrap:anywhere}.tooltip small{display:block;color:#98a2a6;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}.close{position:absolute;right:4px;top:4px;width:32px;height:32px;padding:0;border:0;background:transparent;font-size:21px;font-weight:300;color:#8b989e;line-height:1}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:600px){body{grid-template-rows:66px minmax(0,1fr) 104px}.models{gap:8px}.model{width:108px;font-size:17px}.time{width:calc(100% - 44px);padding-bottom:calc(20px + env(safe-area-inset-bottom))}.tooltip{max-width:min(270px,calc(100vw - 24px))}.close{width:38px;height:38px}.tooltip{padding-right:42px}}
</style></head><body>
<div class="models" role="group" aria-label="Model"><button class="model" type="button" data-model="dream" aria-pressed="true" disabled>Dream</button><button class="model" type="button" data-model="llada" aria-pressed="false" disabled>LLaDA</button></div>
<main id="map" class="map" aria-label="Interactive feature map"><canvas id="cloud" role="img" aria-label="Loading feature map"></canvas><canvas id="boundaries" aria-hidden="true"></canvas><div id="loading" class="loading" role="status">Loading Dream…</div><div id="tooltip" class="tooltip" hidden><button id="close" class="close" type="button" aria-label="Close feature description">×</button><small>Candidate</small><p id="description"></p></div></main>
<div class="time"><output id="current" class="current" for="time">1 / 16</output><label class="sr-only" for="time">Time</label><input id="time" type="range" min="0" max="15" step="1" value="0" aria-valuetext="1 of 16" disabled><div class="ends" aria-hidden="true"><span>1 / 16</span><span>16 / 16</span></div></div>
<p class="sr-only">Positions stay fixed within each model; time changes measured brightness and point size. Features without temporal coordinates are not shown.</p>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),CAMERAS={"llada":{"center":[-0.38924742531651857,-0.20347943903862611],"span":[1.1284948506330372,0.9569588780772522],"core_bounds":[-0.8,0.175,-0.65,0.275],"mapped_count":169634},"dream":{"center":[0.14825830075159102,0.09923632776111485],"span":[0.896516601503182,1.0015273444777701],"core_bounds":[-0.3,0.575,-0.325,0.6],"mapped_count":97445}},PALETTE=['#39797a','#ae7b2c','#8871aa','#668dac','#b4bdc5'],LABELS=['Language form','Numbers & symbols','Word cues'];
const S={manifest:null,semantics:null,boundaryManifest:null,cache:new Map(),data:null,model:'dream',timeByModel:{dream:0,llada:0},bin:0,busy:true,width:1,height:1,dpr:1,camera:null,gl:null,ctx:null,hover:-1,pinned:false,tagTicket:0,pending:false};
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
async function json(path){const response=await fetch(path);if(!response.ok)throw Error('Data unavailable');let bytes=new Uint8Array(await response.arrayBuffer());if(bytes[0]===31&&bytes[1]===139){if(typeof DecompressionStream==='undefined')throw Error('Please use a current browser');bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());}return JSON.parse(new TextDecoder().decode(bytes));}
async function binary(path,count,type){const response=await fetch(path);if(!response.ok)throw Error('Data unavailable');const bytes=await response.arrayBuffer();if(bytes.byteLength!==count*(type==='u8'?1:4))throw Error('Unexpected measurement size');return type==='u8'?new Uint8Array(bytes):new Float32Array(bytes);}
function busy(value,message){S.busy=value;document.querySelectorAll('.model').forEach(n=>n.disabled=value);$('time').disabled=value;$('loading').hidden=!value;if(message)$('loading').textContent=message;}
function color(hex){return [parseInt(hex.slice(1,3),16)/255,parseInt(hex.slice(3,5),16)/255,parseInt(hex.slice(5,7),16)/255];}
async function load(model){if(S.cache.has(model))return S.cache.get(model);const promise=(async()=>{const meta=S.manifest.models[model],sem=S.semantics.models[model],N=meta.count;const [positions,mean,peaks,groups,regions]=await Promise.all([binary(meta.files.positions,N*2),binary(meta.files.mean,N*32),binary(meta.files.peaks,N*3),binary(sem.group_ids,N,'u8'),json(S.boundaryManifest.models[model].file)]);const indices=[],dictIndex=new Uint8Array(N),fineToBroad=new Uint8Array(S.semantics.groups.length);for(const cat of regions.categories)for(const id of cat.group_ids)fineToBroad[id]=cat.id;for(let di=0;di<meta.dictionaries.length;di++){const d=meta.dictionaries[di];dictIndex.fill(di,d.start,d.start+d.count);}for(let i=0;i<N;i++){const x=positions[i*2],y=positions[i*2+1];if(Number.isFinite(x)!==Number.isFinite(y))throw Error('Incomplete coordinate');if(Number.isFinite(x))indices.push(i);}if(indices.length!==meta.mapped_count)throw Error('Coordinate inventory mismatch');const b=meta.bounds,cx=(b[0]+b[1])/2,cy=(b[2]+b[3])/2,half=Math.max(b[1]-b[0],b[3]-b[2])/2,coords=new Float32Array(indices.length*2),colors=new Float32Array(indices.length*4),heads=new Int32Array(128*128),next=new Int32Array(indices.length);heads.fill(-1);next.fill(-1);for(let j=0;j<indices.length;j++){const i=indices[j],x=(positions[i*2]-cx)/half,y=(positions[i*2+1]-cy)/half,category=fineToBroad[groups[i]],rgb=color(PALETTE[category]);coords[j*2]=x;coords[j*2+1]=y;colors.set([...rgb,category===4?.46:1],j*4);const cell=clamp(Math.floor((y+1)*64),0,127)*128+clamp(Math.floor((x+1)*64),0,127);next[j]=heads[cell];heads[cell]=j;}return {model,meta,sem,mean,peaks,groups,regions,dictIndex,coords,colors,indices:Uint32Array.from(indices),strength:new Float32Array(indices.length),heads,next,tags:new Map()};})();S.cache.set(model,promise);try{return await promise;}catch(error){S.cache.delete(model);throw error;}}
const vertex='attribute vec2 a_pos;attribute vec4 a_color;attribute float a_strength;uniform vec2 u_center;uniform float u_scale;uniform vec2 u_view;uniform float u_dpr;varying vec3 v_color;varying float v_alpha;void main(){vec2 p=(a_pos-u_center)*u_scale;gl_Position=vec4(p.x*2./u_view.x,p.y*2./u_view.y,0.,1.);float q=pow(clamp(a_strength,0.,1.),.55);gl_PointSize=(.7+q*2.)*u_dpr;v_color=a_color.rgb;v_alpha=(.006+q*.30)*a_color.a;if(a_strength<0.)v_alpha=.002;}';
const fragment='precision mediump float;varying vec3 v_color;varying float v_alpha;void main(){vec2 p=gl_PointCoord*2.-1.;float r=dot(p,p);if(r>1.)discard;gl_FragColor=vec4(v_color,v_alpha*(1.-smoothstep(.45,1.,r)));}';
function init(){let gl;try{gl=$('cloud').getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:false});if(!gl)throw Error('No WebGL');const shader=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error('Shader unavailable');return s;},program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('Graphics unavailable');gl.useProgram(program);S.gl=gl;S.program=program;S.buffers={pos:gl.createBuffer(),color:gl.createBuffer(),strength:gl.createBuffer()};S.attrs={pos:gl.getAttribLocation(program,'a_pos'),color:gl.getAttribLocation(program,'a_color'),strength:gl.getAttribLocation(program,'a_strength')};S.uniforms={center:gl.getUniformLocation(program,'u_center'),scale:gl.getUniformLocation(program,'u_scale'),view:gl.getUniformLocation(program,'u_view'),dpr:gl.getUniformLocation(program,'u_dpr')};gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);}catch(error){S.gl=null;const replacement=document.createElement('canvas');replacement.id='cloud';replacement.setAttribute('role','img');$('cloud').replaceWith(replacement);S.ctx=replacement.getContext('2d',{alpha:false});}resize();}
function upload(){if(!S.gl)return;const gl=S.gl;for(const [name,array,size] of [['pos',S.data.coords,2],['color',S.data.colors,4],['strength',S.data.strength,1]]){gl.bindBuffer(gl.ARRAY_BUFFER,S.buffers[name]);gl.bufferData(gl.ARRAY_BUFFER,array,name==='strength'?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);gl.enableVertexAttribArray(S.attrs[name]);gl.vertexAttribPointer(S.attrs[name],size,gl.FLOAT,false,0,0);}}
function resize(){const r=$('map').getBoundingClientRect();S.width=Math.max(1,r.width);S.height=Math.max(1,r.height);S.dpr=Math.min(devicePixelRatio||1,2);for(const id of ['cloud','boundaries']){const canvas=$(id);canvas.width=Math.round(S.width*S.dpr);canvas.height=Math.round(S.height*S.dpr);}if(S.gl)S.gl.viewport(0,0,$('cloud').width,$('cloud').height);if(S.data)fit();schedule();}
function fit(){const base=CAMERAS[S.model],padding=S.width<600?22:42,scale=Math.min((S.width-2*padding)/base.span[0],(S.height-2*padding)/base.span[1]);S.camera={center:base.center,scale};$('cloud').dataset.camera=JSON.stringify(S.camera);}
function point(x,y){return [S.width/2+(x-S.camera.center[0])*S.camera.scale,S.height/2-(y-S.camera.center[1])*S.camera.scale];}
function update(){if(!S.data||S.busy)return;S.bin=Number($('time').value);S.timeByModel[S.model]=S.bin;const data=S.data;for(let j=0;j<data.indices.length;j++){const i=data.indices[j],d=data.meta.dictionaries[data.dictIndex[i]],wm=d.temporal_exposure[0][S.bin],wu=d.temporal_exposure[1][S.bin],den=wm+wu,m0=data.mean[i*32+S.bin],m1=data.mean[i*32+16+S.bin],mean=den>0?((wm>0?m0*wm:0)+(wu>0?m1*wu:0))/den:NaN,peak=data.peaks[i*3];data.strength[j]=!Number.isFinite(mean)?-1:peak>0?clamp(mean/peak,0,1):0;}if(S.gl){S.gl.bindBuffer(S.gl.ARRAY_BUFFER,S.buffers.strength);S.gl.bufferSubData(S.gl.ARRAY_BUFFER,0,data.strength);}$('current').textContent=(S.bin+1)+' / 16';$('time').setAttribute('aria-valuetext',(S.bin+1)+' of 16');$('cloud').setAttribute('aria-label',(S.model==='dream'?'Dream':'LLaDA')+' feature map, time '+(S.bin+1)+' of 16');$('map').dataset.model=S.model;$('map').dataset.bin=String(S.bin);schedule();}
function boundaries(){const ctx=$('boundaries').getContext('2d');ctx.setTransform(S.dpr,0,0,S.dpr,0,0);ctx.clearRect(0,0,S.width,S.height);if(!S.data||!S.camera)return;for(const cat of S.data.regions.categories){if(cat.id>2||cat.outline===false)continue;for(const contour of cat.contours){if(contour.level!=='core')continue;for(const polygon of contour.polygons){ctx.beginPath();for(let j=0;j<polygon.length;j++){const p=point(polygon[j][0],polygon[j][1]);if(j===0)ctx.moveTo(...p);else ctx.lineTo(...p);}ctx.closePath();ctx.globalAlpha=.035;ctx.fillStyle=PALETTE[cat.id];ctx.fill();ctx.globalAlpha=.3;ctx.strokeStyle=PALETTE[cat.id];ctx.lineWidth=1;ctx.stroke();}}}ctx.globalAlpha=1;ctx.font=(S.width<600?'11':'12')+'px system-ui';ctx.textAlign='center';const occupied=[];for(const cat of S.data.regions.categories){if(cat.id>2||!Array.isArray(cat.label_position))continue;const anchor=point(...cat.label_position),text=LABELS[cat.id],width=ctx.measureText(text).width;let p=null;for(const [dx,dy] of [[0,0],[0,-24],[0,24],[30,-43],[-30,43],[0,60]]){const x=clamp(anchor[0]+dx,width/2+8,S.width-width/2-8),y=clamp(anchor[1]+dy,18,S.height-10),box=[x-width/2-5,y-14,x+width/2+5,y+5];if(!occupied.some(b=>box[0]<b[2]&&box[2]>b[0]&&box[1]<b[3]&&box[3]>b[1])){p=[x,y];occupied.push(box);break;}}if(!p)continue;ctx.lineWidth=5;ctx.strokeStyle='#ffffffee';ctx.strokeText(text,...p);ctx.fillStyle=['#2d6a6c','#866022','#71568d'][cat.id];ctx.fillText(text,...p);}}
function render(){S.pending=false;if(S.gl){const gl=S.gl;gl.clearColor(1,1,1,1);gl.clear(gl.COLOR_BUFFER_BIT);if(S.data&&S.camera){gl.useProgram(S.program);gl.uniform2f(S.uniforms.center,...S.camera.center);gl.uniform1f(S.uniforms.scale,S.camera.scale);gl.uniform2f(S.uniforms.view,S.width,S.height);gl.uniform1f(S.uniforms.dpr,S.dpr);gl.drawArrays(gl.POINTS,0,S.data.indices.length);}}else if(S.ctx){const ctx=S.ctx;ctx.setTransform(S.dpr,0,0,S.dpr,0,0);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,S.width,S.height);if(S.data&&S.camera)for(let j=0;j<S.data.indices.length;j++){const p=point(S.data.coords[j*2],S.data.coords[j*2+1]);if(p[0]<-4||p[0]>S.width+4||p[1]<-4||p[1]>S.height+4)continue;const q=Math.pow(clamp(S.data.strength[j],0,1),.55),size=.7+q*2,c=S.data.colors;ctx.fillStyle='rgb('+[c[j*4],c[j*4+1],c[j*4+2]].map(v=>Math.round(v*255)).join(',')+')';ctx.globalAlpha=(.006+q*.30)*c[j*4+3];ctx.fillRect(p[0]-size/2,p[1]-size/2,size,size);}ctx.globalAlpha=1;}boundaries();}
function schedule(){if(S.pending)return;S.pending=true;requestAnimationFrame(render);}
function hide(){S.tagTicket++;S.hover=-1;S.pinned=false;$('tooltip').hidden=true;}
async function choose(model){if(S.busy||model===S.model&&S.data)return;hide();busy(true,'Loading '+(model==='dream'?'Dream':'LLaDA')+'…');try{S.model=model;document.querySelectorAll('.model').forEach(n=>n.setAttribute('aria-pressed',String(n.dataset.model===model)));S.data=await load(model);$('time').value=S.timeByModel[model];fit();upload();busy(false);update();}catch(error){busy(true,'Could not load the map. Reload to try again.');}}
function nearest(x,y){if(S.busy||!S.data||!S.camera)return -1;const data=S.data,wx=(x-S.width/2)/S.camera.scale+S.camera.center[0],wy=(S.height/2-y)/S.camera.scale+S.camera.center[1],r=(S.width<600?14:10)/S.camera.scale,fromX=clamp(Math.floor((wx-r+1)*64),0,127),toX=clamp(Math.floor((wx+r+1)*64),0,127),fromY=clamp(Math.floor((wy-r+1)*64),0,127),toY=clamp(Math.floor((wy+r+1)*64),0,127);let best=-1,distance=(S.width<600?14:10)**2;for(let gy=fromY;gy<=toY;gy++)for(let gx=fromX;gx<=toX;gx++)for(let j=data.heads[gy*128+gx];j>=0;j=data.next[j]){const p=point(data.coords[j*2],data.coords[j*2+1]),d=(p[0]-x)**2+(p[1]-y)**2;if(d<distance){best=j;distance=d;}}return best;}
async function tag(data,i){const page=Math.floor(i/S.semantics.page_size),path=data.sem.details_pattern.replace('{page}',String(page).padStart(5,'0'));if(!data.tags.has(page)){data.tags.set(page,json(path));while(data.tags.size>6)data.tags.delete(data.tags.keys().next().value);}const rows=await data.tags.get(page),row=rows[i%S.semantics.page_size],d=data.meta.dictionaries[data.dictIndex[i]],key=data.model+'/layer_'+d.layer+'/'+d.dictionary+'/k_'+d.k+'/feature_'+(i-d.start);if(!row||row.index!==i||row.feature_key!==key||row.group_id!==data.groups[i])throw Error('Evidence identity mismatch');return row;}
function brief(row){let text=row.title.startsWith('Reviewed description')?row.explanation:row.title;if(!text)text=row.explanation;const sentence=text.split(/(?<=[.!?])\s+/)[0];return sentence.length<=170?sentence:sentence.slice(0,167).replace(/\s+\S*$/,'')+'…';}
async function show(j,x,y,pinned){const data=S.data;if(j===S.hover&&!pinned)return;S.hover=j;S.pinned=pinned;const ticket=++S.tagTicket;$('description').textContent='Loading…';$('tooltip').hidden=false;const place=()=>{const box=$('tooltip'),w=box.offsetWidth,h=box.offsetHeight;box.style.left=clamp(x+15,10,Math.max(10,S.width-w-10))+'px';box.style.top=clamp(y+15,10,Math.max(10,S.height-h-10))+'px';};place();try{const row=await tag(data,data.indices[j]);if(ticket!==S.tagTicket||data!==S.data)return;$('description').textContent=brief(row);place();}catch(error){if(ticket===S.tagTicket)$('description').textContent='Description unavailable.';}}
document.querySelectorAll('.model').forEach(n=>n.addEventListener('click',()=>choose(n.dataset.model)));$('time').addEventListener('input',()=>{hide();update();});$('close').addEventListener('click',event=>{event.stopPropagation();hide();});$('map').addEventListener('pointermove',event=>{if(event.pointerType!=='mouse'||S.pinned||event.target.closest('#tooltip'))return;const r=$('map').getBoundingClientRect(),x=event.clientX-r.x,y=event.clientY-r.y,j=nearest(x,y);if(j>=0)show(j,x,y,false);else hide();});$('map').addEventListener('pointerleave',()=>{if(!S.pinned)hide();});$('map').addEventListener('click',event=>{if(event.target.closest('#tooltip'))return;const r=$('map').getBoundingClientRect(),x=event.clientX-r.x,y=event.clientY-r.y,j=nearest(x,y);if(j>=0)show(j,x,y,true);else hide();});document.addEventListener('keydown',event=>{if(event.key==='Escape')hide();});addEventListener('resize',()=>{hide();resize();});
Promise.all([json('manifest.json'),json('semantic_manifest.json'),json('boundary_manifest.json')]).then(async values=>{[S.manifest,S.semantics,S.boundaryManifest]=values;init();S.busy=false;await choose('dream');}).catch(()=>busy(true,'Could not load the map. Reload to try again.'));
})();
</script></body></html>
