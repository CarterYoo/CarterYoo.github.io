about:
  - "Hi, I'm Seunghyun! I'm a Research Fellow at the Supervised Program for Alignment Research and an Undergraduate Researcher at the Governance and Responsible AI Lab (GRAIL), while studying AI (with a math minor) at Purdue."
  - "What I really want is to do research that truly helps humanity. Find the interpretability technique or architecture that actually fits the problem, then use it to crack the problem, figure out what's really going on, or lay the groundwork so the next person (maybe me!) can solve it."
  - "When I'm not staring at activations, I'm probably eating pizza (seriously, a lot of pizza!) or playing Overwatch and TFT. Always happy to chat about any of these!"
interests:
