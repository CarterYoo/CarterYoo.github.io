about:
  - "Hi, I'm Seunghyun! I'm an AI undergrad at Purdue (minoring in math), a Research Fellow at the Supervised Program for Alignment Research, and an Undergraduate Researcher at the Governance and Responsible AI Lab (GRAIL). What I really want is to do research that truly helps humanity. For me, that means finding the interpretability technique or model architecture that actually fits a problem, then using it to solve the problem outright, figure out what's really going on, or lay the groundwork for whoever cracks it next (maybe me!)."
  - "When I'm not staring at activations, I'm probably eating pizza (a lot of it, honestly) or playing Overwatch and TFT, and I'm always up for chatting about any of them!"
interests:
