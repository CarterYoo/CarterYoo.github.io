papers:
  - title: "White Box Evidence Packages for Policy Audit Reports"
    authors: "<b>Seunghyun Yoo</b>"
    venue: "Second Workshop on Technical AI Governance Research (TAIGR), ICML 2026"
    paper_pdf: "https://arxiv.org/abs/2607.21462"
    figure: "/assets/papers/white-box-audit.gif"
    figure_alt: "Animated architecture diagram: a policy passage enters Gemma 2 2B, drawn as a residual stream with attention and MLP blocks. At layer l, a logit lens, a sparse autoencoder and a steering vector read from or write to the stream. The resulting evidence package goes to a fixed auditor whose report is reviewed: the hybrid interface scores most useful, and a report citing shuffled evidence is flagged."
    figure_caption: "White-box tools on the residual stream feed an evidence package for a fixed auditor."
    selected: "y"
    type: "publication"
  - title: "Feature Evolution in Diffusion Language Models"
    authors: "Meliksah Yorulmazlar, Justice Sefas, <b>Seunghyun Yoo</b>, and Lulu Shao"
    venue: "Non-Autoregressive Language Models Workshop, COLM 2026 · Poster"
    paper_pdf: "https://openreview.net/forum?id=3LYTk2idOP"
    figure: "/assets/papers/feature-evolution.gif"
    figure_alt: "Animated architecture diagram: a diffusion language model with one residual stream per position and bidirectional attention between positions. Each denoising step commits confident tokens and feeds them back. An SAE reads layer l, and a heatmap tracks mask-tracking, commitment and unmasked-token features across 64 steps."
    figure_caption: "SAE features across 64 denoising steps: mask tracking, commitment, unmasked responses."
    selected: "y"
    type: "publication"
