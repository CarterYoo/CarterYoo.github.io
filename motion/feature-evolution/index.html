<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=600" />
    <title>Feature Evolution in Diffusion LMs — architecture loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #1d1f21;
        --mid: #5d6267;
        --line: #a3a8ad;
        --faint: #eceef0;
        --fill: #f1f3f5;
        --stream: #e7ecf1;
        --attn: #e5edf5;
        --mlp: #f2eee7;
        --sq: #c9cdd1;
        --accent: #2f5d86;
        --accent-soft: #d6e2ee;
        --alert: #9b3a2c;
        --alert-soft: #f1dfdb;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 960px; height: 600px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; background: var(--bg); }
      #stage { position: absolute; inset: 0; }
      svg { display: block; width: 100%; height: 100%; }
      .t { font: 400 12.5px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--mid); }
      .t-s { font-size: 11px; }
      .t-ink { fill: var(--ink); }
      .m { font: italic 16px/1 "Times New Roman", Times, serif; fill: var(--ink); }
      .m-s { font-size: 13.5px; }
      .wire { fill: none; stroke: var(--line); stroke-width: 1.1; stroke-linejoin: round; }
      .dash { stroke-dasharray: 3 3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="960" data-height="600">
      <div id="stage" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <svg id="svg" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="5" height="5" fill="#fff" />
              <line x1="0" y1="0" x2="0" y2="5" stroke="#c9cdd1" stroke-width="1.2" />
            </pattern>
          </defs>
          <g id="scene" transform="translate(0,6)"></g>
          <g id="pulses" transform="translate(0,6)"></g>
        </svg>
      </div>
    </div>
    <script src="diagram.js"></script>
    <script>
      gsap.registerPlugin(MotionPathPlugin);
      const tl = gsap.timeline(); // content timeline, nested and slowed under `main`
      const { C, el, g, text, math, wire, block, vec, sae, bars } = D;
      const A = D.anim(tl);
      const S = document.getElementById("scene");
      const fp = (d) => el("path", { d, fill: "none", stroke: "none" }, S);

      // ── Bidirectional denoiser over 7 positions (Dream 7B) ──
      const N = 7, XS = Array.from({ length: N }, (_, j) => 132 + j * 56);
      const YB = 446, YT = 150; // stream bottom/top
      const gStreams = g(S, "streams");
      const streams = XS.map((x) => el("rect", { x: x - 4, y: YT, width: 8, height: YB - YT, fill: C.stream }, gStreams));

      // input tokens x_t (masked = hatched)
      const gTok = g(S, "tokens");
      const toks = XS.map((x) => {
        const t = g(gTok, "tok");
        el("rect", { x: x - 16, y: 478, width: 32, height: 26, fill: "url(#hatch)", stroke: C.line, "stroke-width": 1 }, t);
        t._fill = el("rect", { x: x - 16, y: 478, width: 32, height: 26, fill: C.accent, opacity: 0 }, t);
        return t;
      });
      const tokLbl = math(S, 96, 496, [["x"], ["t", "sub"]], { anchor: "end" });
      const WE = block(S, 112, YB, 396, 16, {});
      const WElbl = math(S, 96, YB + 13, [["W"], ["E", "sub"]], { anchor: "end", cls: "m-s" });
      const wTok = XS.map((x) => wire(S, `M${x},477 V${YB + 17}`, { arrow: true }));

      // layers: attention row (mixes positions, both directions) + per-position MLPs
      const rows = [
        { ya: 412, ym: 378, lab: [["L"], ["1", "sub"]] },
        { ya: 318, ym: 284, lab: [["L"], ["ℓ", "sub"]] },
        { ya: 224, ym: 190, lab: [["L"], ["28", "sub"]] },
      ];
      const gRows = g(S, "rows");
      const arcsAll = [];
      rows.forEach((r, i) => {
        r.attn = el("rect", { x: 112, y: r.ya - 7, width: 396, height: 14, rx: 2, fill: C.attn, stroke: C.ink, "stroke-width": 1.1 }, gRows);
        r.mlps = XS.map((x) => block(gRows, x - 10, r.ym - 8, 20, 16, { kind: "plain" }));
        r.mlps.forEach((b) => b._rect.setAttribute("fill", C.mlp));
        // attention from one query position to every other position (left and right)
        const q = [3, 1, 5][i];
        r.arcs = XS.map((x, j) => {
          if (j === q) return null;
          const h = 10 + Math.abs(j - q) * 5;
          const w = 0.35 + 0.65 * (1 - Math.abs(j - q) / 6);
          return el("path", { d: `M${XS[q]},${r.ya - 7} Q${(XS[q] + x) / 2},${r.ya - 7 - h} ${x},${r.ya - 7}`, fill: "none", stroke: C.accent, "stroke-width": 0.6 + w * 1.4, "stroke-opacity": 0.85 }, gRows);
        }).filter(Boolean);
        arcsAll.push(...r.arcs);
        r.label = math(gRows, 96, (r.ya + r.ym) / 2 + 5, r.lab, { anchor: "end", cls: "m-s" });
      });
      const gDots = g(S, "dots");
      text(gDots, 96, 354, "⋮", { cls: "t", anchor: "end" });
      text(gDots, 96, 260, "⋮", { cls: "t", anchor: "end" });
      const lblAttn = text(S, 516, 416, "attention ↔", { cls: "t t-s" });
      const lblMlp = text(S, 516, 382, "MLP", { cls: "t t-s" });

      // unembedding + per-position predictions
      const WU = block(S, 112, 134, 396, 16, {});
      const WUlbl = math(S, 96, 147, [["W"], ["U", "sub"]], { anchor: "end", cls: "m-s" });
      const gPred = g(S, "pred");
      const preds = XS.map((x, j) => bars(gPred, x - 14, 122, [0.3, 0.5, 0.25, 0.4, 0.2], { w: 4, gap: 2, maxH: 26, fill: C.mid }));
      const predLbl = text(S, 516, 116, "p(token)", { cls: "t t-s" });

      // denoising loop: commit confident positions, feed back as x_{t+1}
      const gLoop = g(S, "loop");
      const loopPath = wire(gLoop, `M112,104 H54 V522 H${XS[0]} V505`, { arrow: true });
      const loopLbl = text(gLoop, 46, 300, "next denoising step", { cls: "t t-s", anchor: "middle" });
      loopLbl.setAttribute("transform", "rotate(-90 46 300)");

      // ── SAE on the residual stream at layer ℓ ──
      const TJ = 6, TY = 262;
      const gSae = g(S, "saeg");
      el("circle", { cx: XS[TJ], cy: TY, r: 3.2, fill: C.accent }, gSae);
      const wSae = wire(gSae, `M${XS[TJ]},${TY} H602`, { arrow: true, color: C.accent });
      const sa = sae(gSae, 604, TY, { nIn: 6, nLat: 16, cIn: 10, cLat: 6, latW: 12, span: 40 });
      const saeLbl = text(gSae, sa.latX + 6, sa.top - 10, "SAE", { cls: "t t-s t-ink", anchor: "middle" });
      // three tracked features, colour-coded with the heatmap rows
      const F = [
        { k: 3, color: C.ink, name: "mask-tracking" },
        { k: 8, color: C.accent, name: "commitment" },
        { k: 12, color: "#8d959c", name: "unmasked" },
      ];

      // ── features × denoising steps ──
      const HX = 640, HW = 288, CW = HW / 32;
      const gHeat = g(S, "heat");
      const rowY = [432, 458, 484];
      F.forEach((f, r) => {
        el("rect", { x: HX, y: rowY[r], width: HW, height: 20, fill: C.faint }, gHeat);
        el("rect", { x: HX - 92, y: rowY[r] + 6, width: 8, height: 8, fill: f.color }, gHeat);
        text(gHeat, HX - 80, rowY[r] + 14, f.name, { cls: "t t-s t-ink" });
      });
      el("line", { x1: HX, y1: 514, x2: HX + HW, y2: 514, stroke: C.line, "stroke-width": 1 }, gHeat);
      text(gHeat, HX, 530, "0", { cls: "t t-s" });
      text(gHeat, HX + HW, 530, "64", { cls: "t t-s", anchor: "end" });
      const counter = text(gHeat, HX + HW / 2, 530, "denoising step 0", { cls: "t t-s t-ink", anchor: "middle" });
      const heatTitle = text(gHeat, HX, 420, "SAE feature activation over denoising", { cls: "t t-s" });

      // ── Schedule ──
      const commits = [[2, 5], [0, 4], [6, 1], [3]];
      let masked = 7;
      const iters = commits.map((c, k) => {
        const it = { t: 1.0 + k * 0.8, c, before: masked };
        masked -= c.length;
        it.after = masked;
        return it;
      });

      // Build
      A.fade([gTok, tokLbl], 0.1, { y: 3 });
      A.draw(wTok, 0.25, 0.15);
      A.fade([WE, WElbl], 0.3);
      A.grow(streams, 0.35, { origin: "50% 100%", dur: 0.5, stagger: 0.03, ease: "power2.inOut" });
      rows.forEach((r, i) => {
        const t = 0.45 + i * 0.12;
        A.fade(r.attn, t, { dur: 0.3 });
        A.fade(r.mlps, t + 0.05, { dur: 0.3, stagger: 0.02 });
        A.fade(r.label, t + 0.05);
        A.fade(r.arcs, t + 0.1, { to: 0.22, dur: 0.3 });
      });
      A.fade([gDots, lblAttn, lblMlp], 0.7);
      A.fade([WU, WUlbl], 0.75);
      A.fade(predLbl, 0.8);
      A.draw(loopPath, 0.8, 0.5);
      A.fade(loopLbl, 0.95);
      A.fade(gSae.querySelector("circle"), 0.85);
      A.draw(wSae, 0.85, 0.3);
      A.fade([sa.g, saeLbl], 0.95);
      A.fade(gHeat, 0.95);

      // denoising iterations
      const yToT = (y) => ((YB - y) / (YB - YT)) * 0.45;
      const heatCells = [];
      iters.forEach((it, k) => {
        const t = it.t;
        // forward pass up every position's residual stream
        XS.forEach((x, j) => A.pulse(fp(`M${x},${YB} V${YT}`), t + j * 0.015, 0.45, { color: C.ink, r: 2.4, ease: "none" }));
        rows.forEach((r) => {
          const tr = t + yToT(r.ya);
          tl.fromTo(r.arcs, { opacity: 0.22 }, { opacity: 1, duration: 0.1, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, tr);
          A.flash(r.mlps.map((b) => b._rect), t + yToT(r.ym), C.mlp, "#e4dccd", 0.08);
        });
        // predictions sharpen on positions about to commit
        preds.forEach((bs, j) => {
          const commitNow = it.c.includes(j);
          const done = commits.slice(0, k).flat().includes(j);
          const target = done ? [0.08, 0.95, 0.08, 0.1, 0.06] : commitNow ? [0.1, 0.9, 0.15, 0.12, 0.08] : [0.35 - k * 0.05, 0.5, 0.3, 0.45, 0.25];
          bs.forEach((b, i) => tl.to(b, { attr: { y: 122 - target[i] * 26, height: target[i] * 26 }, fill: commitNow || done ? C.accent : C.mid, duration: 0.2, ease: "power2.out" }, t + 0.45));
        });
        // commit → feed back through the loop
        A.pulse(loopPath, t + 0.55, 0.3, { color: C.accent, r: 3 });
        it.c.forEach((j) => tl.to(toks[j]._fill, { opacity: 1, duration: 0.15 }, t + 0.82));
        // SAE reads layer ℓ
        A.pulse(wSae, t + yToT(TY), 0.2, { color: C.accent, r: 2.6 });
        const tS = t + yToT(TY) + 0.2;
        const shades = ["#5d6267", "#8d959c", "#b1b8be", "#d0d5d9", "#7a838b", "#c3c9ce"];
        [sa.xs, sa.xh].forEach((v, vi) => v.forEach((c, i) => tl.to(c, { fill: shades[(i + k * 2 + vi) % 6], duration: 0.15 }, tS - 0.05 + vi * 0.2)));
        tl.to(sa.fs[F[0].k], { fill: C.ink, fillOpacity: 0.15 + 0.85 * (it.before / 7), duration: 0.15 }, tS);
        tl.to(sa.fs[F[2].k], { fill: "#8d959c", fillOpacity: 0.1 + 0.9 * (1 - it.before / 7), duration: 0.15 }, tS);
        tl.fromTo(sa.fs[F[1].k], { fill: "#ffffff" }, { fill: C.accent, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t + 0.6);
        // heatmap: 8 columns per iteration
        for (let c = 0; c < 8; c++) {
          const col = k * 8 + c;
          const frac = it.before - (c >= 6 ? it.c.length : 0);
          const vals = [0.08 + 0.9 * (frac / 7), c === 6 ? 0.95 : 0.05, Math.max(0.05, (1 - frac / 7) * (c % 3 === 1 ? 0.9 : 0.3))];
          vals.forEach((v, r) => {
            const cell = el("rect", { x: HX + col * CW + 0.5, y: rowY[r], width: CW - 1, height: 20, fill: F[r].color, opacity: 0 }, gHeat);
            tl.fromTo(cell, { opacity: 0 }, { opacity: v, duration: 0.1 }, t + c * 0.095);
          });
        }
        const proxy = { s: k * 16 };
        tl.fromTo(proxy, { s: k * 16 }, { s: (k + 1) * 16, duration: 0.76, ease: "none", immediateRender: false, onUpdate: () => { counter.textContent = `denoising step ${Math.round(proxy.s)}`; } }, t);
      });

      // 7 s loop: content plays at 0.8× speed, holds on the result, then fades for a clean restart.
      const main = gsap.timeline({ paused: true });
      tl.timeScale(0.8);
      main.add(tl, 0);
      main.to(["#scene", "#pulses"], { opacity: 0, duration: 0.42, ease: "power2.in" }, 6.55);
      window.__timelines["main"] = main;
      main.seek(0);
    </script>
  </body>
</html>
