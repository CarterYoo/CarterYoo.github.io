<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=600" />
    <title>DLM-Control — architecture loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #1d1f21;
        --mid: #5d6267;
        --line: #a3a8ad;
        --faint: #eceef0;
        --fill: #f1f3f5;
        --stream: #e7ecf1;
        --attn: #e5edf5;
        --mlp: #f2eee7;
        --sq: #c9cdd1;
        --accent: #2f5d86;
        --accent-soft: #d6e2ee;
        --alert: #9b3a2c;
        --alert-soft: #f1dfdb;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 960px; height: 600px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; background: var(--bg); }
      #stage { position: absolute; inset: 0; }
      svg { display: block; width: 100%; height: 100%; }
      .t { font: 400 12.5px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--mid); }
      .t-s { font-size: 11px; }
      .t-ink { fill: var(--ink); }
      .m { font: italic 16px/1 "Times New Roman", Times, serif; fill: var(--ink); }
      .m-s { font-size: 13.5px; }
      .wire { fill: none; stroke: var(--line); stroke-width: 1.1; stroke-linejoin: round; }
      .dash { stroke-dasharray: 3 3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="960" data-height="600">
      <div id="stage" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <svg id="svg" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="5" height="5" fill="#fff" />
              <line x1="0" y1="0" x2="0" y2="5" stroke="#c9cdd1" stroke-width="1.2" />
            </pattern>
          </defs>
          <g id="scene" transform="translate(0,12)"></g>
          <g id="pulses" transform="translate(0,12)"></g>
        </svg>
      </div>
    </div>
    <script src="diagram.js"></script>
    <script>
      gsap.registerPlugin(MotionPathPlugin);
      const tl = gsap.timeline(); // content timeline, nested and slowed under `main`
      const { C, el, g, text, math, wire, plus, block, vec, sae } = D;
      const A = D.anim(tl);
      const S = document.getElementById("scene");
      const fp = (d) => el("path", { d, fill: "none", stroke: "none" }, S);

      // ── LLaDA-8B: one residual stream, blocks read on the right and write back with ⊕ ──
      const SX = 213, SB = 476, ST = 122;
      const band = el("rect", { x: SX - 7, y: ST, width: 14, height: SB - ST, fill: C.stream }, S);

      // noisy input x_t (masked positions hatched) and predicted clean sequence x̂_0
      const seq = (y, cls) => {
        const gg = g(S, cls);
        return { g: gg, cells: Array.from({ length: 6 }, (_, i) => {
          const c = g(gg, "cell");
          el("rect", { x: 124 + i * 30, y, width: 26, height: 22, fill: "url(#hatch)", stroke: C.line, "stroke-width": 1 }, c);
          c._fill = el("rect", { x: 124 + i * 30, y, width: 26, height: 22, fill: C.mid, opacity: 0 }, c);
          return c;
        }) };
      };
      const xin = seq(518, "xin");
      const xout = seq(54, "xout");
      const xinLbl = math(S, 112, 534, [["x"], ["t", "sub"]], { anchor: "end" });
      const xoutLbl = math(S, 112, 70, [["x̂"], ["0", "sub"]], { anchor: "end" });
      const WE = block(S, 163, SB, 100, 28, { math: [["W"], ["E", "sub"]] });
      const wE = wire(S, `M${SX},517 V${SB + 29}`, { arrow: true });
      const WU = block(S, 163, ST - 24, 100, 24, { math: [["W"], ["U", "sub"]] });
      const wU = wire(S, `M${SX},${ST - 24} V77`, { arrow: true });

      const blocks = [
        { c: 428, kind: "attn" }, { c: 388, kind: "mlp" },
        { c: 322, kind: "attn" }, { c: 282, kind: "mlp" },
        { c: 186, kind: "attn" }, { c: 146, kind: "mlp" },
      ];
      const gBlk = g(S, "blocks");
      blocks.forEach((b) => {
        b.blk = block(gBlk, 246, b.c - 15, 54, 30, { kind: b.kind, grid: 4, causal: false });
        b.r = wire(gBlk, `M${SX + 7},${b.c + 8} H245`, { arrow: true });
        b.w = wire(gBlk, `M246,${b.c - 8} H${SX + 7}`, { arrow: true });
        b.p = plus(gBlk, SX, b.c - 8);
      });
      const gLab = g(S, "labs");
      math(gLab, 190, 413, [["L"], ["1", "sub"]], { anchor: "end", cls: "m-s" });
      math(gLab, 190, 307, [["L"], ["ℓ", "sub"]], { anchor: "end", cls: "m-s" });
      math(gLab, 190, 171, [["L"], ["32", "sub"]], { anchor: "end", cls: "m-s" });
      text(gLab, 190, 360, "⋮", { cls: "t", anchor: "end" });
      text(gLab, 190, 224, "⋮", { cls: "t", anchor: "end" });
      text(gLab, 306, 190, "attention", { cls: "t t-s" });
      text(gLab, 306, 150, "MLP", { cls: "t t-s" });

      // denoising loop
      const loop = wire(S, `M118,65 H66 V529 H118`, { arrow: true });
      const loopLbl = text(S, 58, 290, "denoising step  t → t+1", { cls: "t t-s", anchor: "middle" });
      loopLbl.setAttribute("transform", "rotate(-90 58 290)");

      // ── Trajectory SAE monitor at layer ℓ ──
      const TY = 258;
      const tapDot = el("circle", { cx: SX, cy: TY, r: 3.2, fill: C.accent }, S);
      const wTap = wire(S, `M${SX + 7},${TY} H382`, { arrow: true, color: C.accent });
      const sa = sae(S, 384, TY, { nIn: 6, nLat: 16, cIn: 10, cLat: 6, latW: 12, span: 34 });
      const saeLbl = text(S, sa.latX + 6, sa.top - 10, "SAE", { cls: "t t-s t-ink", anchor: "middle" });
      const SUS = 9; // suspicious feature
      const NX = sa.latX + 6, NY = 392;
      const wScore = wire(S, `M${NX},${sa.bottom + 24} V${NY - 15}`, { arrow: true });
      const gScore = g(S, "score");
      const scoreC = el("circle", { cx: NX, cy: NY, r: 15, fill: "#fff", stroke: C.ink, "stroke-width": 1.1 }, gScore);
      math(gScore, NX, NY + 5, [["s"], ["t", "sub"]], { cls: "m-s" });
      text(gScore, NX, NY + 32, "monitor score", { cls: "t t-s", anchor: "middle" });
      const wChart = wire(S, `M${NX + 15},${NY} H612`, { arrow: true });

      // steering: subtract the flagged direction at layer ℓ
      const PY = 238;
      const pSteer = plus(S, SX, PY);
      const wSteer = wire(S, `M${NX - 15},${NY} H330 V${PY} H${SX + 7}`, { arrow: true, color: C.accent });
      const gSv = g(S, "sv");
      vec(gSv, 336, 318, 4, { cell: 9, gap: 2, fill: C.accent, stroke: C.accent });
      math(gSv, 350, 334, [["−α"], ["v"]], { anchor: "start", cls: "m-s", style: "fill: var(--accent)" });
      const steerTint = el("rect", { x: SX - 7, y: ST, width: 14, height: PY - ST, fill: C["accent-soft"], opacity: 0 });
      S.insertBefore(steerTint, gBlk);

      // ── Detection chart ──
      const X = (s) => 620 + (s / 64) * 290, Yv = (v) => 400 - v * 230;
      const gChart = g(S, "chart");
      el("line", { x1: 620, y1: 400, x2: 910, y2: 400, stroke: C.ink, "stroke-width": 1 }, gChart);
      el("line", { x1: 620, y1: 400, x2: 620, y2: 150, stroke: C.ink, "stroke-width": 1 }, gChart);
      [0, 16, 32, 48, 64].forEach((s) => {
        el("line", { x1: X(s), y1: 400, x2: X(s), y2: 405, stroke: C.ink, "stroke-width": 1 }, gChart);
        text(gChart, X(s), 420, String(s), { cls: "t t-s", anchor: "middle" });
      });
      text(gChart, 765, 440, "denoising step", { cls: "t t-s", anchor: "middle" });
      math(gChart, 606, 160, [["s"], ["t", "sub"]], { anchor: "end", cls: "m-s" });
      el("line", { x1: 620, y1: Yv(0.5), x2: 910, y2: Yv(0.5), stroke: C.line, "stroke-width": 1, "stroke-dasharray": "4 4" }, gChart);
      text(gChart, 910, Yv(0.5) - 6, "threshold", { cls: "t t-s", anchor: "end" });
      const DET = 9.6;
      const pts = [];
      for (let s = 0; s <= 64; s += 0.5) {
        const v = 0.12 + 0.72 / (1 + Math.exp(-(s - DET) / 2.0)) + Math.sin(s * 1.1) * 0.006;
        pts.push(`${X(s).toFixed(1)},${Yv(v).toFixed(1)}`);
      }
      const trace = el("path", { d: "M" + pts.join(" L"), fill: "none", stroke: C.ink, "stroke-width": 1.5, "stroke-linejoin": "round" }, gChart);
      const tlen = Math.ceil(trace.getTotalLength()) + 1;
      trace.style.strokeDasharray = `${tlen} ${tlen}`;
      const gDet = g(S, "det");
      el("line", { x1: X(DET), y1: Yv(0.5), x2: X(DET), y2: 400, stroke: C.alert, "stroke-width": 1, "stroke-dasharray": "2 3" }, gDet);
      el("circle", { cx: X(DET), cy: Yv(0.5), r: 4, fill: C.alert }, gDet);
      text(gDet, X(DET) + 8, Yv(0.5) + 18, "9.6  trajectory monitor", { cls: "t t-s", style: "fill: var(--alert)" });
      const gLate = g(S, "late");
      el("line", { x1: X(63), y1: 400, x2: X(63), y2: 360, stroke: C.ink, "stroke-width": 1, "stroke-dasharray": "2 3" }, gLate);
      el("circle", { cx: X(63), cy: 360, r: 4, fill: C.ink }, gLate);
      text(gLate, X(63) - 8, 352, "63  output-only", { cls: "t t-s t-ink", anchor: "end" });
      const gGap = g(S, "gap");
      el("line", { x1: X(DET) + 6, y1: 470, x2: X(63) - 6, y2: 470, stroke: C.mid, "stroke-width": 1 }, gGap);
      el("path", { d: `M${X(DET)},470 l7,-3 v6 z M${X(63)},470 l-7,-3 v6 z`, fill: C.mid }, gGap);
      text(gGap, (X(DET) + X(63)) / 2, 462, "earlier warning", { cls: "t t-s", anchor: "middle" });

      // ── Timeline ──
      A.fade([xin.g, xinLbl], 0.1, { y: 3 });
      A.draw(wE, 0.22, 0.12);
      A.fade(WE, 0.25);
      A.grow(band, 0.3, { origin: "50% 100%", dur: 0.55, ease: "power2.inOut" });
      blocks.forEach((b, i) => {
        const t = 0.38 + i * 0.06;
        A.fade(b.blk, t, { dur: 0.3 });
        A.draw([b.r, b.w], t + 0.08, 0.18);
        A.fade(b.p, t + 0.12, { dur: 0.2 });
      });
      A.fade(gLab, 0.7);
      A.fade(WU, 0.75);
      A.draw(wU, 0.8, 0.12);
      A.fade([xout.g, xoutLbl], 0.85);
      A.draw(loop, 0.8, 0.45);
      A.fade(loopLbl, 0.95);
      A.fade(tapDot, 0.8);
      A.draw(wTap, 0.82, 0.25);
      A.fade([sa.g, saeLbl], 0.9);
      A.draw(wScore, 0.95, 0.15);
      A.fade(gScore, 1.0);
      A.draw(wChart, 1.0, 0.3);
      A.fade(gChart, 0.85);

      // Denoising: 12 forward passes over steps 0 → 64
      const T0 = 1.05, T1 = 4.05, NP = 12, DP = (T1 - T0) / NP;
      const stepAt = (t) => ((t - T0) / (T1 - T0)) * 64;
      const tD = T0 + (DET / 64) * (T1 - T0);
      tl.fromTo(trace, { strokeDashoffset: tlen }, { strokeDashoffset: 0, duration: T1 - T0, ease: "none" }, T0);
      const resolveOrder = [[1], [4], [0, 5], [2], [3]];
      const attackIdx = new Set([1, 3]);
      for (let k = 0; k < NP; k++) {
        const t = T0 + k * DP;
        A.pulse(fp(`M${SX},${SB} V${ST}`), t, DP * 0.85, { color: C.ink, r: 3, ease: "none" });
        blocks.forEach((b) => {
          const tb = t + ((SB - b.c) / (SB - ST)) * DP * 0.85;
          A.flash(b.blk._rect, tb - 0.02, b.kind === "attn" ? C.attn : C.mlp, b.kind === "attn" ? C["accent-soft"] : "#e4dccd", 0.06);
        });
        const tTap = t + ((SB - TY) / (SB - ST)) * DP * 0.85;
        A.pulse(wTap, tTap, 0.12, { color: C.accent, r: 2.4 });
        const s = stepAt(t + DP);
        const sus = 0.1 + 0.9 / (1 + Math.exp(-(s - DET) / 2.0));
        tl.to(sa.fs[SUS], { fill: C.alert, fillOpacity: sus, duration: 0.1 }, tTap + 0.12);
        sa.xs.forEach((c, i) => tl.to(c, { fill: ["#5d6267", "#8d959c", "#b1b8be", "#d0d5d9", "#7a838b", "#c3c9ce"][(i + k) % 6], duration: 0.08 }, tTap + 0.05));
        A.pulse(wScore, tTap + 0.15, 0.08, { color: s > DET ? C.alert : C.ink, r: 2.4 });
        // input tokens resolve step by step; the output prediction follows
        if (k < resolveOrder.length) resolveOrder[k].forEach((i) => {
          tl.to(xin.cells[i]._fill, { opacity: 1, fill: attackIdx.has(i) ? (t > tD ? "#a3a9ae" : C.alert) : "#a3a9ae", duration: 0.1 }, t + DP * 0.9);
          tl.to(xout.cells[i]._fill, { opacity: 1, fill: attackIdx.has(i) ? (t > tD ? "#a3a9ae" : C.alert) : "#a3a9ae", duration: 0.1 }, t + DP * 0.8);
        });
        if (k > 0) A.pulse(loop, t - 0.02, DP * 0.7, { color: C.mid, r: 2.2 });
        // after detection, every pass is steered at layer ℓ
        if (t > tD) {
          A.pulse(wSteer, t, DP * 0.7, { color: C.accent, r: 2.6 });
          A.flash(pSteer.querySelector("circle"), t + DP * 0.65, "#ffffff", C["accent-soft"], 0.06);
        }
      }
      // detection at step 9.6
      tl.to(scoreC, { stroke: C.alert, fill: C["alert-soft"], duration: 0.15 }, tD);
      A.fade(gDet, tD, { dur: 0.25 });
      A.draw(wSteer, tD + 0.05, 0.35);
      A.fade(gSv, tD + 0.2);
      tl.fromTo(steerTint, { opacity: 0 }, { opacity: 1, duration: 0.3 }, tD + 0.35);
      // output-only check sees the final output only
      const tL = T0 + (63 / 64) * (T1 - T0);
      A.fade(gLate, tL, { dur: 0.25 });
      A.fade(gGap, tL + 0.15, { dur: 0.3 });

      // 7 s loop: content plays at 0.8× speed, holds on the result, then fades for a clean restart.
      const main = gsap.timeline({ paused: true });
      tl.timeScale(0.8);
      main.add(tl, 0);
      main.to(["#scene", "#pulses"], { opacity: 0, duration: 0.42, ease: "power2.in" }, 6.55);
      window.__timelines["main"] = main;
      main.seek(0);
    </script>
  </body>
</html>
