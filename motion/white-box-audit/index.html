<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=600" />
    <title>White Box Evidence Packages — architecture loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #1d1f21;
        --mid: #5d6267;
        --line: #a3a8ad;
        --faint: #eceef0;
        --fill: #f1f3f5;
        --stream: #e7ecf1;
        --attn: #e5edf5;
        --mlp: #f2eee7;
        --sq: #c9cdd1;
        --accent: #2f5d86;
        --accent-soft: #d6e2ee;
        --alert: #9b3a2c;
        --alert-soft: #f1dfdb;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 960px; height: 600px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; background: var(--bg); }
      #stage { position: absolute; inset: 0; }
      svg { display: block; width: 100%; height: 100%; }
      .t { font: 400 12.5px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--mid); }
      .t-s { font-size: 11px; }
      .t-ink { fill: var(--ink); }
      .m { font: italic 16px/1 "Times New Roman", Times, serif; fill: var(--ink); }
      .m-s { font-size: 13.5px; }
      .wire { fill: none; stroke: var(--line); stroke-width: 1.1; stroke-linejoin: round; }
      .dash { stroke-dasharray: 3 3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="960" data-height="600">
      <div id="stage" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <svg id="svg" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
          <g id="scene" transform="translate(0,22)"></g>
          <g id="pulses" transform="translate(0,22)"></g>
        </svg>
      </div>
    </div>
    <script src="diagram.js"></script>
    <script>
      gsap.registerPlugin(MotionPathPlugin);
      const tl = gsap.timeline(); // content timeline, nested and slowed under `main`
      const { C, el, g, text, math, wire, plus, block, vec, sae, bars } = D;
      const A = D.anim(tl);
      const S = document.getElementById("scene");

      // ── Target LM (Gemma 2 2B): residual stream, attention and MLP blocks ──
      const Y = 230; // stream centre
      const gIn = g(S, "in");
      el("path", { d: "M30,196 h34 l12,12 v48 h-46 z", fill: "#fff", stroke: C.ink, "stroke-width": 1.1 }, gIn);
      [212, 222, 232, 242].forEach((y, i) => el("line", { x1: 37, y1: y, x2: i === 2 ? 66 : 62, y2: y, stroke: i === 2 ? C.accent : C.sq, "stroke-width": 2.5 }, gIn));
      text(gIn, 53, 276, "policy", { cls: "t t-s", anchor: "middle" });
      const wIn = wire(S, "M76,230 H93", { arrow: true });
      const WE = block(S, 94, 212, 32, 36, { math: [["W"], ["E", "sub"]] });

      const gStream = g(S, "stream");
      const band = el("rect", { x: 126, y: Y - 7, width: 530, height: 14, fill: C.stream }, gStream);
      const streamLbl = text(gStream, 132, Y + 24, "residual stream", { cls: "t t-s" });
      const gDots = g(S, "ell");
      text(gDots, 287, Y - 12, "⋯", { cls: "t", anchor: "middle" });
      text(gDots, 506, Y - 12, "⋯", { cls: "t", anchor: "middle" });

      const layers = [
        { ax: 180, mx: 235, lab: [["L"], ["0", "sub"]] },
        { ax: 345, mx: 400, lab: [["L"], ["ℓ", "sub"]] },
        { ax: 556, mx: 611, lab: [["L"], ["25", "sub"]] },
      ];
      const gLayers = g(S, "layers");
      layers.forEach((L) => {
        L.attn = block(gLayers, L.ax - 22, 146, 44, 38, { kind: "attn", heads: 4 });
        L.mlp = block(gLayers, L.mx - 22, 276, 44, 38, { kind: "mlp" });
        L.r1 = wire(gLayers, `M${L.ax - 12},${Y - 7} V184`, { arrow: true });
        L.w1 = wire(gLayers, `M${L.ax + 12},184 V${Y - 6.5}`, { arrow: true });
        L.p1 = plus(gLayers, L.ax + 12, Y);
        L.r2 = wire(gLayers, `M${L.mx - 12},${Y + 7} V276`, { arrow: true });
        L.w2 = wire(gLayers, `M${L.mx + 12},276 V${Y + 6.5}`, { arrow: true });
        L.p2 = plus(gLayers, L.mx + 12, Y);
        L.label = math(gLayers, (L.ax + L.mx) / 2, 136, L.lab, { cls: "m-s" });
      });
      const blkLbl = g(S, "blk-lbl");
      text(blkLbl, 154, 169, "attention", { cls: "t t-s", anchor: "end" });
      text(blkLbl, 209, 299, "MLP", { cls: "t t-s", anchor: "end" });
      const WU = block(S, 660, 212, 32, 36, { math: [["W"], ["U", "sub"]] });
      const gLog = g(S, "logits");
      const logAxis = el("line", { x1: 700, y1: 248, x2: 772, y2: 248, stroke: C.line, "stroke-width": 1 }, gLog);
      const logitBars = bars(gLog, 702, 248, [0.12, 0.2, 0.1, 0.95, 0.18, 0.3, 0.08, 0.14, 0.1], { w: 5.5, gap: 2.5, maxH: 34, fill: C.ink });
      const logLbl = text(gLog, 736, 266, "logits", { cls: "t t-s", anchor: "middle" });

      // ── White-box tools at layer ℓ ──
      const TX = 440;
      const gTap = g(S, "tap");
      el("circle", { cx: TX, cy: Y, r: 3.2, fill: C.accent }, gTap);

      // Logit lens: unembed the intermediate residual
      const gLens = g(S, "lens");
      const wLens = wire(gLens, `M${TX},${Y - 7} V101`, { arrow: true, color: C.accent });
      const lensWU = block(gLens, TX - 16, 72, 32, 28, { math: [["W"], ["U", "sub"]] });
      const wLens2 = wire(gLens, `M${TX - 16},86 H414`, { arrow: true });
      const lensAxis = el("line", { x1: 352, y1: 100, x2: 412, y2: 100, stroke: C.line, "stroke-width": 1 }, gLens);
      const lensBars = bars(gLens, 354, 100, [0.2, 0.35, 0.25, 0.6, 0.3, 0.45, 0.2], { w: 5.5, gap: 2.8, maxH: 26, fill: C.accent });
      const lensLbl = text(gLens, 382, 60, "logit lens", { cls: "t t-s t-ink", anchor: "middle" });

      // Steering: add α·v to the residual stream
      const SX = 470;
      const gSteer = g(S, "steer");
      const vCells = vec(gSteer, SX - 5, 78, 4, { cell: 10, gap: 2, fill: C.accent, stroke: C.accent });
      const steerM = math(gSteer, SX + 12, 104, [["+α"], ["v"]], { anchor: "start", cls: "m-s" });
      const steerLbl = text(gSteer, SX + 12, 70, "steering", { cls: "t t-s t-ink" });
      const wSteer = wire(gSteer, `M${SX},126 V${Y - 6.5}`, { arrow: true, color: C.accent });
      const pSteer = plus(gSteer, SX, Y);
      const steerTint = el("rect", { x: SX + 7, y: Y - 7, width: 656 - SX - 7, height: 14, fill: C["accent-soft"], opacity: 0 });
      S.insertBefore(steerTint, gLayers);

      // SAE: x → f(x) → x̂
      const gSae = g(S, "saeg");
      const wSae = wire(gSae, `M${TX},${Y + 7} V383`, { arrow: true, color: C.accent });
      const sa = sae(gSae, TX - 5, 420, { nIn: 6, nLat: 16, cIn: 10, cLat: 6, latW: 12, span: 40 });
      const saeLbl = text(gSae, sa.latX + 6, sa.top - 10, "SAE", { cls: "t t-s t-ink", anchor: "middle" });
      const lit = [1, 6, 11];

      // Explanation surrogate: readable label for a feature
      const gExp = g(S, "exp");
      const expLine = wire(gExp, `M${sa.latX + 12},${sa.top + 11} C${sa.latX + 40},${sa.top - 6} 560,336 586,336`, {});
      const expBox = el("rect", { x: 586, y: 322, width: 108, height: 28, rx: 2, fill: "#fff", stroke: C.ink, "stroke-width": 1.1 }, gExp);
      const expTxt = text(gExp, 596, 340, "“obligation”", { cls: "t t-s t-ink" });
      const expLbl = text(gExp, 640, 366, "explanation", { cls: "t t-s", anchor: "middle" });

      // ── Evidence package → fixed auditor → report ──
      const gPkg = g(S, "pkg");
      const pkgLbl = text(gPkg, 790, 128, "evidence package", { cls: "t t-s t-ink" });
      const pkgBox = el("rect", { x: 790, y: 138, width: 140, height: 162, rx: 2, fill: "#fff", stroke: C.ink, "stroke-width": 1.1 }, gPkg);
      const rowY = [150, 188, 226, 264];
      const rowNames = ["SAE features", "logit lens", "steering", "explanation"];
      const rows = rowY.map((y, i) => {
        const r = g(gPkg, "row");
        el("rect", { x: 798, y, width: 124, height: 28, rx: 2, fill: C.fill }, r);
        if (i === 0) [0, 1, 2].forEach((k) => el("rect", { x: 806 + k * 9, y: y + 10, width: 7, height: 7, fill: C.accent }, r));
        if (i === 1) bars(r, 806, y + 20, [0.3, 0.7, 0.4], { w: 5, gap: 2, maxH: 12, fill: C.accent });
        if (i === 2) el("path", { d: `M806,${y + 14} H826 M821,${y + 10} L826,${y + 14} L821,${y + 18}`, fill: "none", stroke: C.accent, "stroke-width": 1.4 }, r);
        if (i === 3) el("rect", { x: 806, y: y + 9, width: 20, height: 10, fill: "#fff", stroke: C.ink, "stroke-width": 0.9 }, r);
        text(r, 836, y + 18, rowNames[i], { cls: "t t-s t-ink" });
        return r;
      });
      const wAud = wire(S, "M860,300 V338", { arrow: true });
      const audNote = text(S, 868, 324, "+ passage, rubric", { cls: "t t-s" });
      const gAud = g(S, "aud");
      el("rect", { x: 800, y: 338, width: 120, height: 34, rx: 2, fill: "#fff", stroke: C.ink, "stroke-width": 1.1 }, gAud);
      text(gAud, 860, 359, "auditor (fixed)", { cls: "t t-s t-ink", anchor: "middle" });
      const wRep = wire(S, "M860,372 V400", { arrow: true });
      const gRep = g(S, "rep");
      const repDoc = el("path", { d: "M836,400 h38 l10,10 v58 h-48 z", fill: "#fff", stroke: C.ink, "stroke-width": 1.1 }, gRep);
      const repLines = [418, 428, 438, 448, 458].map((y, i) => el("line", { x1: 843, y1: y, x2: i % 2 ? 866 : 872, y2: y, stroke: C.sq, "stroke-width": 2.2 }, gRep));
      const cites = [418, 438, 458].map((y) => el("circle", { cx: 878, cy: y, r: 2.4, fill: C.accent }, gRep));
      const flag = text(S, 860, 492, "reads well, cites shuffled evidence", { cls: "t t-s", anchor: "middle", style: "fill: var(--alert)" });

      // Human review of each interface: the hybrid package is the most useful
      const gUse = g(S, "use");
      text(gUse, 636, 404, "review · usefulness", { cls: "t t-s t-ink" });
      const useVals = [["surface", 0.55], ["white-box", 0.5], ["hybrid", 0.86]];
      const useBars = useVals.map(([n, v], i) => {
        const y = 418 + i * 18;
        text(gUse, 690, y + 9, n, { cls: "t t-s", anchor: "end" });
        el("rect", { x: 696, y, width: 82, height: 10, fill: C.faint }, gUse);
        return el("rect", { x: 696, y, width: 82 * v, height: 10, fill: i === 2 ? C.accent : "#9aa0a6" }, gUse);
      });
      const wUse = wire(S, "M835,436 H786", { arrow: true });

      // Hidden flight paths for evidence chips
      const fp = (d) => el("path", { d, fill: "none", stroke: "none" }, S);
      const flights = [
        fp(`M${sa.latX + 6},${sa.top + 12} C620,420 720,220 806,164`),
        fp("M382,64 C520,20 720,40 806,202"),
        fp(`M${SX},80 C600,60 740,140 806,240`),
        fp("M694,336 C740,330 770,300 806,278"),
      ];

      // ── Timeline ──
      A.fade(gIn, 0.1, { y: 3 });
      A.draw(wIn, 0.3, 0.15);
      A.fade(WE, 0.35);
      A.grow(band, 0.4, { x: true, origin: "0% 50%", dur: 0.6, ease: "power2.inOut" });
      A.fade(streamLbl, 0.6);
      layers.forEach((L, i) => {
        const t = 0.5 + i * 0.12;
        A.fade([L.attn, L.mlp], t, { dur: 0.35 });
        A.draw([L.r1, L.w1, L.r2, L.w2], t + 0.1, 0.25);
        A.fade([L.p1, L.p2, L.label], t + 0.15, { dur: 0.3 });
      });
      A.fade([gDots, blkLbl], 0.75);
      A.fade(WU, 0.85);
      A.fade([logAxis, logLbl], 0.9);

      // Forward pass
      const T0 = 0.95, T1 = 1.95;
      const tx = (x) => T0 + ((x - 126) / 530) * (T1 - T0);
      A.pulse(fp(`M126,${Y} H656`), T0, T1 - T0, { color: C.ink, r: 3.2, ease: "none" });
      layers.forEach((L) => {
        const a = tx(L.ax - 12), m = tx(L.mx - 12);
        A.pulse(L.r1, a, 0.12, { color: C.ink, r: 2.5 });
        A.flash(L.attn._rect, a + 0.1, C.attn, C["accent-soft"], 0.1);
        A.pulse(L.w1, a + 0.14, 0.12, { color: C.ink, r: 2.5 });
        A.pulse(L.r2, m, 0.12, { color: C.ink, r: 2.5 });
        A.flash(L.mlp._rect, m + 0.1, C.mlp, "#e4dccd", 0.1);
        A.pulse(L.w2, m + 0.14, 0.12, { color: C.ink, r: 2.5 });
      });
      A.grow(logitBars, T1 + 0.05, { stagger: 0.02, dur: 0.35 });

      // Tap at layer ℓ
      const tT = tx(TX);
      A.fade(gTap, tT - 0.05, { dur: 0.15 });
      // logit lens
      A.draw(wLens, tT, 0.25);
      A.pulse(wLens, tT, 0.25);
      A.fade([lensWU, lensAxis, lensLbl], tT + 0.15, { dur: 0.3 });
      A.draw(wLens2, tT + 0.3, 0.12);
      A.grow(lensBars, tT + 0.38, { stagger: 0.02, dur: 0.3 });
      // SAE
      A.draw(wSae, tT + 0.05, 0.3);
      A.pulse(wSae, tT + 0.05, 0.3);
      A.fade([sa.g, saeLbl], tT + 0.2, { dur: 0.3 });
      tl.fromTo(sa.xs, { fill: C.fill }, { fill: (i) => ["#8d959c", "#c3c9ce", "#5d6267", "#b1b8be", "#7a838b", "#d0d5d9"][i], duration: 0.25, stagger: 0.03, immediateRender: false }, tT + 0.35);
      lit.forEach((k, j) => tl.fromTo(sa.fs[k], { fill: "#ffffff" }, { fill: C.accent, duration: 0.2, ease: "power2.out", immediateRender: false }, tT + 0.6 + j * 0.06));
      tl.fromTo(sa.xh, { fill: C.fill }, { fill: (i) => ["#959ca3", "#c3c9ce", "#646c73", "#b1b8be", "#838b93", "#d0d5d9"][i], duration: 0.25, stagger: 0.03, immediateRender: false }, tT + 0.85);
      // steering
      const tS = tT + 0.6;
      A.fade([vCells, steerM, steerLbl], tS, { dur: 0.3 });
      A.draw(wSteer, tS + 0.15, 0.3);
      A.fade(pSteer, tS + 0.15);
      A.pulse(wSteer, tS + 0.2, 0.3);
      tl.fromTo(steerTint, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "sine.out" }, tS + 0.45);
      tl.to(steerTint, { opacity: 0, duration: 0.5, ease: "sine.in" }, tS + 1.0);
      // explanation surrogate
      A.draw(expLine, tT + 0.85, 0.3);
      A.fade([expBox, expTxt, expLbl], tT + 1.05, { dur: 0.3 });

      // Evidence package
      const tP = 2.75;
      A.fade([pkgLbl, pkgBox], tP - 0.1);
      flights.forEach((f, i) => {
        A.pulse(f, tP + i * 0.07, 0.45, { color: C.accent, r: 3.2 });
        A.fade(rows[i], tP + 0.4 + i * 0.07, { dur: 0.25 });
      });
      A.draw(wAud, 3.25, 0.2);
      A.fade(audNote, 3.25);
      A.fade(gAud, 3.35);
      A.draw(wRep, 3.5, 0.2);
      A.fade(repDoc, 3.6);
      tl.fromTo(repLines, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.25, stagger: 0.04 }, 3.65);
      A.fade(cites, 3.85, { stagger: 0.05 });
      A.draw(wUse, 3.95, 0.2);
      A.fade(gUse, 4.0, { dur: 0.3 });
      tl.fromTo(useBars, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, stagger: 0.08, ease: "power3.out" }, 4.1);
      // Shuffled control: same format, wrong case — the report still reads well
      tl.to(rows[0], { y: 76, duration: 0.4, ease: "power2.inOut" }, 4.45);
      tl.to(rows[2], { y: -76, duration: 0.4, ease: "power2.inOut" }, 4.45);
      tl.to(repDoc, { stroke: C.alert, duration: 0.2 }, 4.65);
      tl.to(cites, { fill: C.alert, duration: 0.2 }, 4.65);
      A.fade(flag, 4.65, { dur: 0.25 });

      // 7 s loop: content plays at 0.8× speed, holds on the result, then fades for a clean restart.
      const main = gsap.timeline({ paused: true });
      tl.timeScale(0.8);
      main.add(tl, 0);
      main.to(["#scene", "#pulses"], { opacity: 0, duration: 0.42, ease: "power2.in" }, 6.55);
      window.__timelines["main"] = main;
      main.seek(0);
    </script>
  </body>
</html>
