<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=540" />
    <title>Ethogram — behaviour atlas clip</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 960px; height: 540px; overflow: hidden; background: #0b0b0c; }
      #root { position: relative; width: 100%; height: 100%; background: #0b0b0c; }
      #atlas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #veil { position: absolute; inset: 0; background: #0b0b0c; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="960" data-height="540">
      <!-- Behaviour atlas section of the Ethogram demo (≈24–34 s of demo.mp4), played at 1.6× -->
      <video
        id="atlas"
        src="assets/atlas-clip.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="6.5"
        data-media-start="0.6"
        data-playback-rate="1.6"
        data-track-index="0"
      ></video>
      <div id="veil" class="clip" data-start="0" data-duration="7" data-track-index="1"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // fade in from black, hold, fade back to black so the GIF loops cleanly
      tl.fromTo("#veil", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.out" }, 0);
      tl.to("#veil", { opacity: 1, duration: 0.5, ease: "power1.in" }, 6.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
